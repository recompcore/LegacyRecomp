name: Analyze Mali GPU Backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze librexgpu-xenos.so
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify GPU library
        run: |
          set -euo pipefail

          FILE="librexgpu-xenos.so"

          if [ ! -f "$FILE" ]; then
            echo "::error::librexgpu-xenos.so was not found in the repository root."
            exit 1
          fi

          echo "Found:"
          ls -lh "$FILE"

          file "$FILE"

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            llvm \
            python3 \
            python3-pip

          python3 -m pip install --break-system-packages \
            pyelftools

      - name: Create report directory
        run: |
          mkdir -p gpu-analysis

      - name: ELF overview
        run: |
          set -euo pipefail

          FILE="librexgpu-xenos.so"
          OUT="gpu-analysis/01-elf-overview.txt"

          {
            echo "=== FILE ==="
            file "$FILE"
            echo

            echo "=== SIZE ==="
            ls -lh "$FILE"
            stat "$FILE"
            echo

            echo "=== ELF HEADER ==="
            readelf -h "$FILE"
            echo

            echo "=== PROGRAM HEADERS ==="
            readelf -l "$FILE"
            echo

            echo "=== SECTIONS ==="
            readelf -S "$FILE"
          } > "$OUT"

      - name: Dump symbols and imports
        run: |
          set -euo pipefail

          FILE="librexgpu-xenos.so"

          readelf -Ws "$FILE" \
            > gpu-analysis/02-symbols.txt

          objdump -T "$FILE" \
            > gpu-analysis/03-dynamic-symbols.txt

          readelf -r "$FILE" \
            > gpu-analysis/04-relocations.txt

      - name: Search Vulkan symbols
        run: |
          set -euo pipefail

          FILE="librexgpu-xenos.so"
          OUT="gpu-analysis/05-vulkan-symbol-search.txt"

          {
            echo "=== VULKAN-RELATED SYMBOLS ==="
            grep -iE \
              'vulkan|vk[A-Z]|physicaldevice|createdevice|feature' \
              gpu-analysis/02-symbols.txt || true

            echo
            echo "=== VULKAN-RELATED DYNAMIC SYMBOLS ==="
            grep -iE \
              'vulkan|vk[A-Z]|physicaldevice|createdevice|feature' \
              gpu-analysis/03-dynamic-symbols.txt || true
          } > "$OUT"

      - name: Search relevant strings
        run: |
          set -euo pipefail

          FILE="librexgpu-xenos.so"
          OUT="gpu-analysis/06-relevant-strings.txt"

          strings -a -n 4 "$FILE" |
            grep -iE \
              'vertexPipelineStoresAndAtomics|fragmentShaderInterlock|VK_EXT_fragment_shader_interlock|vkCreateDevice|vkGetPhysicalDeviceFeatures|vkGetPhysicalDeviceFeatures2|Vulkan|physical device|logical device|shader interlock|memexport|render target|pipeline' \
            > "$OUT" || true

          echo "=== MATCHES ==="
          cat "$OUT"

      - name: Locate Vulkan strings with offsets
        run: |
          set -euo pipefail

          FILE="librexgpu-xenos.so"
          OUT="gpu-analysis/07-string-offsets.txt"

          strings -a -t x -n 4 "$FILE" |
            grep -iE \
              'vertexPipelineStoresAndAtomics|fragmentShaderInterlock|VK_EXT_fragment_shader_interlock|vkCreateDevice|vkGetPhysicalDeviceFeatures|vkGetPhysicalDeviceFeatures2|Vulkan|physical device|logical device|shader interlock|memexport' \
            > "$OUT" || true

          cat "$OUT"

      - name: Disassembly
        run: |
          set -euo pipefail

          FILE="librexgpu-xenos.so"

          # Full ARM64 disassembly. This gives us a searchable copy
          # without requiring a GUI decompiler.
          llvm-objdump \
            -d \
            --triple=aarch64-linux-android \
            "$FILE" \
            > gpu-analysis/08-disassembly.txt || \
          llvm-objdump \
            -d \
            "$FILE" \
            > gpu-analysis/08-disassembly.txt

      - name: Search disassembly for relevant references
        run: |
          set -euo pipefail

          DISASM="gpu-analysis/08-disassembly.txt"
          OUT="gpu-analysis/09-disassembly-vulkan-search.txt"

          {
            echo "=== Vulkan-related references ==="
            grep -inE \
              'vkCreateDevice|vkGetPhysicalDeviceFeatures|vkGetPhysicalDeviceFeatures2|fragmentShaderInterlock|vertexPipelineStoresAndAtomics' \
              "$DISASM" || true

            echo
            echo "=== Feature / device initialization references ==="
            grep -inE \
              'PhysicalDevice|physical.?device|LogicalDevice|logical.?device|Features|feature' \
              "$DISASM" | head -n 500 || true
          } > "$OUT"

      - name: Python ELF analysis
        run: |
          python3 <<'PY'
          from pathlib import Path
          from elftools.elf.elffile import ELFFile

          path = Path("librexgpu-xenos.so")
          out = Path("gpu-analysis/10-python-elf-analysis.txt")

          with path.open("rb") as f:
              elf = ELFFile(f)

              with out.open("w", encoding="utf-8") as o:
                  o.write("=== ELF ANALYSIS ===\n")
                  o.write(f"Class: {elf.elfclass}\n")
                  o.write(f"Machine: {elf['e_machine']}\n")
                  o.write(f"Type: {elf['e_type']}\n")
                  o.write(f"Entry: 0x{elf['e_entry']:x}\n")
                  o.write(f"Sections: {elf.num_sections()}\n\n")

                  o.write("=== DYNAMIC SYMBOLS ===\n")

                  dynsym = elf.get_section_by_name(".dynsym")

                  if dynsym:
                      for sym in dynsym.iter_symbols():
                          name = sym.name or ""

                          if any(
                              x.lower() in name.lower()
                              for x in [
                                  "vulkan",
                                  "vk",
                                  "physicaldevice",
                                  "createdevice",
                                  "feature",
                                  "rex_gpu",
                              ]
                          ):
                              o.write(
                                  f"{name} "
                                  f"value=0x{sym['st_value']:x} "
                                  f"size={sym['st_size']} "
                                  f"bind={sym['st_info']['bind']} "
                                  f"type={sym['st_info']['type']}\n"
                              )
                  else:
                      o.write("No .dynsym section found.\n")
          PY

      - name: Create summary
        run: |
          set -euo pipefail

          OUT="gpu-analysis/SUMMARY.md"

          {
            echo "# ReXGPU Xenos Vulkan Analysis"
            echo
            echo "## Target"
            echo
            echo "\`librexgpu-xenos.so\`"
            echo
            echo "## Interesting strings"
            echo
            echo '```'
            cat gpu-analysis/06-relevant-strings.txt || true
            echo '```'
            echo
            echo "## Vulkan symbol matches"
            echo
            echo '```'
            cat gpu-analysis/05-vulkan-symbol-search.txt || true
            echo '```'
            echo
            echo "## Next investigation"
            echo
            echo "Look for the Vulkan physical-device feature query and logical-device creation path."
            echo "Do NOT patch the binary until the required feature and fallback path are identified."
          } > "$OUT"

          cat "$OUT" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload analysis report
        uses: actions/upload-artifact@v4
        with:
          name: librexgpu-xenos-analysis
          path: gpu-analysis/
          compression-level: 9
          retention-days: 14
