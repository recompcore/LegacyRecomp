name: Analyze ReXGPU Vulkan Compatibility

on:
  workflow_dispatch:
    inputs:
      so_path:
        description: "Path to librexgpu-xenos.so in the repository"
        required: true
        default: "librexgpu-xenos.so"
        type: string

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze librexgpu-xenos.so
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            binutils-aarch64-linux-gnu \
            file \
            unzip \
            python3

      - name: Verify ELF
        env:
          SO: ${{ inputs.so_path }}
        run: |
          set -euo pipefail

          test -f "$SO" || {
            echo "::error::Could not find $SO"
            exit 1
          }

          echo "=== FILE ==="
          file "$SO"

          echo
          echo "=== ELF HEADER ==="
          readelf -h "$SO"

          echo
          echo "=== DYNAMIC DEPENDENCIES ==="
          readelf -d "$SO" | grep NEEDED || true

      - name: Extract strings
        env:
          SO: ${{ inputs.so_path }}
        run: |
          set -euo pipefail

          strings -a -n 4 "$SO" > strings.txt

          echo "Total strings:"
          wc -l strings.txt

      - name: Search Vulkan compatibility targets
        run: |
          set -euo pipefail

          cat > targets.txt <<'EOF'
          vertexPipelineStoresAndAtomics
          fragmentStoresAndAtomics
          pipeline_requirements_not_met
          geometryShader
          fillModeNonSolid
          vulkan_require_geometry_shader
          vulkan_require_fill_mode_non_solid
          vulkan_readback_memexport
          readback_memexport_fast
          IssueDraw_MemexportReadbackFullPath
          Enable CPU readback of shader memexport writes
          Vertex shader memexport draw encountered
          Pixel shader memexport draw encountered
          VulkanProvider
          VulkanProvider::Create
          _ZN3rex2ui6vulkan14VulkanProvider6CreateEbb
          FLAGS_vulkan_require_geometry_shader_storage
          FLAGS_vulkan_require_fill_mode_non_solid_storage
          EOF

          echo "=== MATCHES ===" | tee vulkan-matches.txt

          while IFS= read -r target; do
            echo
            echo "### $target"
            grep -Fni -- "$target" strings.txt || true
          done < targets.txt | tee -a vulkan-matches.txt

      - name: Export symbols
        env:
          SO: ${{ inputs.so_path }}
        run: |
          set -euo pipefail

          readelf -Ws "$SO" > symbols.txt
          nm -D -C "$SO" > demangled-symbols.txt 2>&1 || true

          echo "=== RELEVANT SYMBOLS ===" > relevant-symbols.txt

          grep -Ei \
            'VulkanProvider|VulkanDevice|pipeline_requirements|vertexPipeline|fragmentStores|geometryShader|fillModeNonSolid|memexport|Create' \
            demangled-symbols.txt \
            >> relevant-symbols.txt || true

      - name: Locate Vulkan source references
        run: |
          set -euo pipefail

          {
            echo "=== SOURCE PATHS EMBEDDED IN ELF ==="
            grep -aEi \
              '/rexglue-sdk/src/graphics/vulkan/|graphics/vulkan/|pipeline/shader/' \
              strings.txt || true

            echo
            echo "=== RELEVANT SOURCE FILES ==="
            grep -aEi \
              'command_processor.cpp|shared_memory.cpp|shader.cpp|pipeline_cache.cpp|render_target_cache.cpp|texture_cache.cpp|translator.cpp' \
              strings.txt || true
          } > source-references.txt

      - name: Disassemble relevant ARM64 code
        env:
          SO: ${{ inputs.so_path }}
        run: |
          set -euo pipefail

          aarch64-linux-gnu-objdump \
            -d \
            -C \
            "$SO" > disassembly.txt 2>&1 || true

          echo "=== VulkanProvider / compatibility functions ===" \
            > relevant-disassembly.txt

          grep -n -A120 -B20 \
            'VulkanProvider::Create' \
            disassembly.txt \
            >> relevant-disassembly.txt || true

          echo >> relevant-disassembly.txt
          echo "=== pipeline requirement references ===" \
            >> relevant-disassembly.txt

          grep -n -A80 -B20 \
            -Ei \
            'pipeline_requirements|vertexPipelineStores|fragmentStoresAndAtomics' \
            disassembly.txt \
            >> relevant-disassembly.txt || true

      - name: Generate summary
        run: |
          {
            echo "# ReXGPU Vulkan Compatibility Analysis"
            echo
            echo "## Target"
            echo
            echo '```'
            file "${{ inputs.so_path }}"
            echo '```'
            echo
            echo "## Critical Vulkan targets"
            echo
            echo '```'
            grep -Ei \
              'vertexPipelineStoresAndAtomics|fragmentStoresAndAtomics|pipeline_requirements_not_met|geometryShader|fillModeNonSolid|vulkan_readback_memexport' \
              strings.txt || true
            echo '```'
            echo
            echo "## Relevant symbols"
            echo
            echo '```'
            sed -n '1,250p' relevant-symbols.txt
            echo '```'
            echo
            echo "## Embedded ReXGlue source paths"
            echo
            echo '```'
            cat source-references.txt
            echo '```'
            echo
            echo "## Next investigation targets"
            echo
            echo "- VulkanProvider::Create"
            echo "- pipeline_requirements_not_met"
            echo "- vertexPipelineStoresAndAtomics"
            echo "- fragmentStoresAndAtomics"
            echo "- existing memexport readback paths"
            echo "- existing geometry/primitive fallback paths"
          } > analysis-summary.md

          cat analysis-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: rexgpu-vulkan-analysis
          path: |
            analysis-summary.md
            strings.txt
            vulkan-matches.txt
            symbols.txt
            demangled-symbols.txt
            relevant-symbols.txt
            source-references.txt
            disassembly.txt
            relevant-disassembly.txt
          retention-days: 14

### What you do

Put your **existing** `librexgpu-xenos.so` in the repository, for example:

```text
LegacyRecomp/
└── librexgpu-xenos.so

Then:

GitHub → Actions → Analyze ReXGPU Vulkan Compatibility → Run workflow

Leave the default path as:

librexgpu-xenos.so

This doesn't rebuild Minecraft and doesn't modify your APK.

The important artifact will be:

rexgpu-vulkan-analysis

And particularly:

relevant-disassembly.txt

That's the file I want to see next. That should tell us whether the fatal Mali check is an actual hard requirement or a branch we can potentially redirect into one of the existing fallback paths.
