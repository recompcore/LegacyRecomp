name: Find Vulkan Feature Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  find-vulkan:
    name: Locate Vulkan feature check
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout LegacyRecomp
        uses: actions/checkout@v4

      - name: Download and patch ReXGlue SDK
        run: |
          set -euo pipefail
          tools/android_sdk.sh

      - name: Search ReXGlue Vulkan source
        run: |
          set +e

          REPORT="$GITHUB_WORKSPACE/vulkan-report.txt"

          echo "==============================================" > "$REPORT"
          echo "LegacyRecomp / ReXGlue Vulkan diagnostic" >> "$REPORT"
          echo "==============================================" >> "$REPORT"
          echo "" >> "$REPORT"

          echo "=== vertexPipelineStoresAndAtomics ===" >> "$REPORT"
          grep -Rni \
            "vertexPipelineStoresAndAtomics" \
            android/sdk/rexglue-sdk \
            2>/dev/null >> "$REPORT"

          echo "" >> "$REPORT"
          echo "=== Vulkan device creation ===" >> "$REPORT"
          grep -RniE \
            "vkCreateDevice|vkGetPhysicalDeviceFeatures|physical.*device|CreateDevice" \
            android/sdk/rexglue-sdk/src \
            2>/dev/null | head -300 >> "$REPORT"

          echo "" >> "$REPORT"
          echo "=== Vulkan/GPU source files ===" >> "$REPORT"
          find android/sdk/rexglue-sdk \
            -type f \
            \( -iname "*vulkan*" -o -iname "*gpu*" \) \
            -print | sort >> "$REPORT"

          echo "" >> "$REPORT"
          echo "=== Report complete ===" >> "$REPORT"

          cat "$REPORT"

      - name: Upload Vulkan report
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-report
          path: vulkan-report.txt
          retention-days: 7
