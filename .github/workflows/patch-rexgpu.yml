name: Mali G57 - Patch LegacyRecomp APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APK: legacyrecomp-android.apk
  REXGPU: librexgpu-xenos.so
  BUILD_TOOLS: "35.0.0"

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check inputs
        run: |
          set -euo pipefail

          test -f "$APK"
          test -f "$REXGPU"

          echo "APK:"
          ls -lh "$APK"

          echo "ReXGPU:"
          ls -lh "$REXGPU"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;35.0.0"

      - name: Set Android tools
        run: |
          set -euo pipefail

          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"

          test -x "$BT/zipalign"
          test -x "$BT/apksigner"

          echo "BT=$BT" >> "$GITHUB_ENV"

          "$BT/apksigner" version

      # ------------------------------------------------------------
      # Keep a copy of the original APK and library.
      # ------------------------------------------------------------
      - name: Prepare workspace
        run: |
          set -euo pipefail

          rm -rf work
          mkdir -p work/apk

          cp "$APK" work/original.apk
          cp "$REXGPU" work/rexgpu-original.so

          unzip -q work/original.apk -d work/apk

      # ------------------------------------------------------------
      # Find the actual library inside the APK.
      # ------------------------------------------------------------
      - name: Locate ReXGPU
        run: |
          set -euo pipefail

          LIB="$(find work/apk \
            -type f \
            -name "$REXGPU" \
            -print -quit)"

          test -n "$LIB"

          echo "LIB=$LIB" >> "$GITHUB_ENV"

          echo "Found:"
          echo "$LIB"

      # ------------------------------------------------------------
      # Analyze the actual library.
      #
      # We don't assume a fixed offset because an ELF binary can
      # change between builds.
      # ------------------------------------------------------------
      - name: Analyze ReXGPU
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y binutils

          echo "ELF:"
          file "$LIB"

          echo
          echo "Architecture:"
          readelf -h "$LIB" | grep -E 'Class|Machine'

          echo
          echo "Vulkan references:"
          strings -a -t x "$LIB" | \
            grep -i \
              -E 'vertexPipelineStoresAndAtomics|vkGetPhysicalDeviceFeatures|vkCreateDevice' \
              || true

      # ------------------------------------------------------------
      # PATCH
      #
      # IMPORTANT:
      # The patch is applied ONLY when the expected byte pattern is
      # found. This prevents silently corrupting a different build.
      #
      # Replace OLD_BYTES and NEW_BYTES with the bytes from the
      # confirmed feature-check instruction.
      # ------------------------------------------------------------
      - name: Patch Mali Vulkan feature check
        env:
          OLD_BYTES: ""
          NEW_BYTES: ""
          PATCH_OFFSET: ""
        run: |
          set -euo pipefail

          if [ -z "$PATCH_OFFSET" ] || \
             [ -z "$OLD_BYTES" ] || \
             [ -z "$NEW_BYTES" ]; then
            echo "::error::The confirmed ARM64 patch bytes/offset have not been supplied."
            echo
            echo "The workflow successfully located the real ReXGPU library."
            echo "It will NOT guess an instruction and corrupt the binary."
            exit 1
          fi

          python3 - "$LIB" "$PATCH_OFFSET" "$OLD_BYTES" "$NEW_BYTES" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          offset = int(sys.argv[2], 0)
          old = bytes.fromhex(sys.argv[3])
          new = bytes.fromhex(sys.argv[4])

          data = bytearray(path.read_bytes())

          if data[offset:offset + len(old)] != old:
              got = data[offset:offset + len(old)].hex(" ")
              raise SystemExit(
                  f"Expected bytes {old.hex(' ')} at "
                  f"{offset:#x}, found {got}"
              )

          data[offset:offset + len(old)] = new
          path.write_bytes(data)

          print(f"Patched {path} at {offset:#x}")
          print(f"OLD: {old.hex(' ')}")
          print(f"NEW: {new.hex(' ')}")
          PY

      # ------------------------------------------------------------
      # Replace only the library.
      # ------------------------------------------------------------
      - name: Install patched ReXGPU
        run: |
          set -euo pipefail

          cp "$LIB" work/patched-rexgpu.so

      # ------------------------------------------------------------
      # Rebuild APK.
      #
      # The original APK structure is retained.
      # ------------------------------------------------------------
      - name: Repack APK
        run: |
          set -euo pipefail

          cd work/apk

          zip -q -r -0 ../patched-unsigned.apk .

          cd ../..

          test -s work/patched-unsigned.apk

      # ------------------------------------------------------------
      # VERSION
      #
      # This uses apktool rather than trying to edit the compiled
      # AndroidManifest.xml with sed.
      # ------------------------------------------------------------
      - name: Install apktool
        run: |
          set -euo pipefail

          curl -fsSL \
            -o apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/latest/download/apktool.jar

          test -s apktool.jar

      - name: Decode APK for version update
        run: |
          set -euo pipefail

          java -jar apktool.jar d \
            -f \
            work/patched-unsigned.apk \
            -o work/apktool

      - name: Update version
        run: |
          set -euo pipefail

          MANIFEST="work/apktool/AndroidManifest.xml"

          test -f "$MANIFEST"

          echo "Current manifest:"
          grep -E \
            'version(Name|Code)|package=' \
            "$MANIFEST" || true

          python3 - "$MANIFEST" <<'PY'
          import re
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          # versionName: 1.2
          if 'android:versionName=' not in s:
              raise SystemExit("versionName not found")

          s = re.sub(
              r'android:versionName="[^"]*"',
              'android:versionName="1.2"',
              s,
              count=1
          )

          # Increment versionCode by one.
          m = re.search(r'android:versionCode="([0-9]+)"', s)

          if not m:
              raise SystemExit("versionCode not found")

          old_code = int(m.group(1))
          new_code = old_code + 1

          s = s[:m.start(1)] + str(new_code) + s[m.end(1):]

          p.write_text(s)

          print(f"versionName: 1.2")
          print(f"versionCode: {old_code} -> {new_code}")
          PY

      - name: Rebuild versioned APK
        run: |
          set -euo pipefail

          java -jar apktool.jar b \
            work/apktool \
            -o work/versioned-unsigned.apk

          test -s work/versioned-unsigned.apk

      # ------------------------------------------------------------
      # 16 KB ZIP alignment.
      # Android documents this exact verification method.
      # ------------------------------------------------------------
      - name: Zipalign 16 KB
        run: |
          set -euo pipefail

          "$BT/zipalign" \
            -P 16 \
            -f \
            4 \
            work/versioned-unsigned.apk \
            work/legacyrecomp-android-1.2-aligned.apk

      - name: Verify 16 KB alignment
        run: |
          set -euo pipefail

          "$BT/zipalign" \
            -c \
            -P 16 \
            -v \
            4 \
            work/legacyrecomp-android-1.2-aligned.apk

      # ------------------------------------------------------------
      # SIGNING
      #
      # THIS MUST USE THE EXISTING SIGNING MECHANISM FROM YOUR
      # REPOSITORY. Nothing here creates a new keystore.
      # ------------------------------------------------------------
      - name: Sign APK
        run: |
          set -euo pipefail

          # Copy the signing command already used by the project here.
          #
          # The input MUST be:
          # work/legacyrecomp-android-1.2-aligned.apk
          #
          # The output MUST be:
          # legacyrecomp-android-1.2.apk

          echo "::error::Existing project signing command must be retained here."
          exit 1

      - name: Verify signed APK
        run: |
          set -euo pipefail

          test -f legacyrecomp-android-1.2.apk

          "$BT/apksigner" verify \
            --verbose \
            legacyrecomp-android-1.2.apk

          "$BT/zipalign" \
            -c \
            -P 16 \
            -v \
            4 \
            legacyrecomp-android-1.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LegacyRecomp-Mali-G57-v1.2
          path: legacyrecomp-android-1.2.apk
          if-no-files-found: error
