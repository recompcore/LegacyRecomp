name: Patch LegacyRecomp for Mali-G57

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APK: legacyrecomp-android.apk
  REXGPU: librexgpu-xenos.so
  BUILD_TOOLS: "35.0.0"

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check inputs
        shell: bash
        run: |
          set -euo pipefail

          test -f "$APK" || {
            echo "::error::$APK is missing from repository root"
            exit 1
          }

          test -f "$REXGPU" || {
            echo "::error::$REXGPU is missing from repository root"
            exit 1
          }

          echo "APK:"
          ls -lh "$APK"

          echo
          echo "ReXGPU:"
          ls -lh "$REXGPU"

          echo
          echo "ReXGPU SHA256:"
          sha256sum "$REXGPU"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;35.0.0"

      - name: Define Android tools
        shell: bash
        run: |
          set -euo pipefail

          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"

          test -x "$BT/zipalign"
          test -x "$BT/apksigner"

          echo "BT=$BT" >> "$GITHUB_ENV"

          "$BT/apksigner" version

      - name: Inspect original APK
        shell: bash
        run: |
          set -euo pipefail

          echo "APK contents:"
          unzip -l "$APK" | grep -F "$REXGPU"

          echo
          echo "Original APK certificate:"
          "$BT/apksigner" verify --print-certs "$APK"

      - name: Extract APK
        shell: bash
        run: |
          set -euo pipefail

          rm -rf work
          mkdir -p work/apk

          unzip -q "$APK" -d work/apk

          FOUND="$(find work/apk \
            -type f \
            -name "$REXGPU" \
            -print -quit)"

          test -n "$FOUND" || {
            echo "::error::$REXGPU is not present inside APK"
            exit 1
          }

          echo "REXGPU_IN_APK=$FOUND" >> "$GITHUB_ENV"

          echo "Found library:"
          echo "$FOUND"

      # ----------------------------------------------------------
      # ACTUAL RECGPU PATCH
      #
      # IMPORTANT:
      # This operates on the .so itself.
      #
      # Once the confirmed offset + replacement bytes are known,
      # put the direct binary patch command here.
      #
      # Nothing else in the APK is modified by this step.
      # ----------------------------------------------------------
      - name: Patch librexgpu-xenos.so
        shell: bash
        run: |
          set -euo pipefail

          cp "$REXGPU" work/librexgpu-xenos-patched.so

          echo "Patch target:"
          echo "work/librexgpu-xenos-patched.so"

          # --------------------------------------------------------
          # INSERT THE CONFIRMED BINARY PATCH HERE.
          #
          # Example shape only:
          #
          # python3 - <<'PY'
          # from pathlib import Path
          #
          # p = Path("work/librexgpu-xenos-patched.so")
          # b = bytearray(p.read_bytes())
          #
          # offset = ...
          # old = bytes.fromhex("...")
          # new = bytes.fromhex("...")
          #
          # assert b[offset:offset + len(old)] == old
          # b[offset:offset + len(new)] = new
          # p.write_bytes(b)
          # PY
          #
          # DO NOT PUT A GUESSED PATCH HERE.
          # --------------------------------------------------------

          echo "Patch step reached."

      - name: Install patched ReXGPU
        shell: bash
        run: |
          set -euo pipefail

          cp \
            work/librexgpu-xenos-patched.so \
            "$REXGPU_IN_APK"

          echo "Installed patched library:"
          ls -lh "$REXGPU_IN_APK"

      - name: Repack APK
        shell: bash
        run: |
          set -euo pipefail

          cd work/apk

          # Preserve APK entries as stored ZIP entries.
          zip -q -r -0 ../unsigned.apk .

          cd ../..

          test -s work/unsigned.apk

          echo "Unsigned APK:"
          ls -lh work/unsigned.apk

      # ----------------------------------------------------------
      # VERSION
      #
      # We do this BEFORE zipalign/signing.
      #
      # The package name must remain unchanged.
      # versionName becomes 1.2.
      # versionCode must increase over 1.1.
      #
      # This needs to use the APK's actual manifest rather than
      # blindly replacing text in AndroidManifest.xml.
      # ----------------------------------------------------------
      - name: Update app version
        shell: bash
        run: |
          set -euo pipefail

          echo "Target version: 1.2"

          # IMPORTANT:
          # Wire the actual manifest/versionCode operation here.
          #
          # Do not use sed on the binary AndroidManifest.xml.
          #
          # Expected result:
          #   versionName = 1.2
          #   versionCode = original versionCode + 1
          #
          # The package/application ID must remain identical.

          exit 1

      # ----------------------------------------------------------
      # 16 KB PAGE ALIGNMENT
      # ----------------------------------------------------------
      - name: Zipalign
        shell: bash
        run: |
          set -euo pipefail

          "$BT/zipalign" \
            -P 16 \
            -f \
            4 \
            work/versioned-unsigned.apk \
            work/legacyrecomp-android-1.2-aligned.apk

      - name: Verify 16 KB alignment
        shell: bash
        run: |
          set -euo pipefail

          "$BT/zipalign" \
            -c \
            -P 16 \
            -v \
            4 \
            work/legacyrecomp-android-1.2-aligned.apk

      # ----------------------------------------------------------
      # EXISTING SIGNING
      #
      # KEEP YOUR CURRENT LegacyRecomp SIGNING COMMAND HERE.
      #
      # No new keystore.
      # No new secret.
      # No new certificate.
      # ----------------------------------------------------------
      - name: Sign with existing LegacyRecomp signing
        shell: bash
        run: |
          set -euo pipefail

          echo "Use the existing signing command from the repository here."

          exit 1

      - name: Verify final APK
        shell: bash
        run: |
          set -euo pipefail

          test -f legacyrecomp-android-1.2.apk

          "$BT/apksigner" verify \
            --verbose \
            legacyrecomp-android-1.2.apk

          "$BT/zipalign" \
            -c \
            -P 16 \
            -v \
            4 \
            legacyrecomp-android-1.2.apk

          echo
          echo "FINAL APK:"
          ls -lh legacyrecomp-android-1.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: legacyrecomp-android-1.2-mali-g57
          path: legacyrecomp-android-1.2.apk
          if-no-files-found: error
