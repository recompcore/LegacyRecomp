name: Patch ReXGPU Android APK - Mali G57

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APK_IN: legacyrecomp-android.apk
  GPU_SO: librexgpu-xenos.so
  BUILD_TOOLS: "35.0.0"
  VERSION_NAME: "1.2"

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ------------------------------------------------------------
      # SOURCE
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check input files
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking repository inputs..."

          test -f "$APK_IN" || {
            echo "::error::$APK_IN not found in repository root"
            exit 1
          }

          test -f "$GPU_SO" || {
            echo "::error::$GPU_SO not found in repository root"
            exit 1
          }

          echo
          echo "APK:"
          ls -lh "$APK_IN"

          echo
          echo "ReXGPU library:"
          ls -lh "$GPU_SO"

      # ------------------------------------------------------------
      # JAVA / ANDROID TOOLS
      # ------------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;35.0.0"

      - name: Set Android tool paths
        shell: bash
        run: |
          set -euo pipefail

          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"

          test -x "$BT/apksigner"
          test -x "$BT/zipalign"

          echo "ANDROID_BUILD_TOOLS=$BT" >> "$GITHUB_ENV"

          echo "Using:"
          echo "$BT"

          echo
          "$BT/apksigner" version

          echo
          echo "zipalign:"
          "$BT/zipalign" -P 16 -f 4 --help >/dev/null 2>&1 || true

      # ------------------------------------------------------------
      # INSPECT ORIGINAL
      # ------------------------------------------------------------
      - name: Verify original APK
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_BUILD_TOOLS/apksigner" verify \
            --verbose \
            "$APK_IN"

          echo
          echo "Checking for ReXGPU..."

          unzip -l "$APK_IN" | grep -F "$GPU_SO"

      # ------------------------------------------------------------
      # WORK DIRECTORY
      # ------------------------------------------------------------
      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          rm -rf work
          mkdir -p work/apk

          cp "$APK_IN" work/original.apk
          cp "$GPU_SO" work/rexgpu-original.so

          unzip -q work/original.apk -d work/apk

      # ------------------------------------------------------------
      # FIND LIBRARY
      # ------------------------------------------------------------
      - name: Locate ReXGPU library
        shell: bash
        run: |
          set -euo pipefail

          FOUND="$(find work/apk \
            -type f \
            -name "$GPU_SO" \
            -print -quit)"

          if [ -z "$FOUND" ]; then
            echo "::error::$GPU_SO was not found after APK extraction"
            exit 1
          fi

          echo "REXGPU_PATH=$FOUND" >> "$GITHUB_ENV"

          echo "Found:"
          echo "$FOUND"

      # ------------------------------------------------------------
      # PATCH LIBRARY
      #
      # patch_rexgpu.py is intentionally separate.
      #
      # It must perform the confirmed Mali-G57 patch and nothing else.
      # ------------------------------------------------------------
      - name: Apply Mali G57 ReXGPU patch
        shell: bash
        run: |
          set -euo pipefail

          cp "$REXGPU_PATH" work/rexgpu-before.so

          test -f patch_rexgpu.py || {
            echo "::error::patch_rexgpu.py is missing"
            exit 1
          }

          python3 patch_rexgpu.py "$REXGPU_PATH"

          cmp -s "$REXGPU_PATH" work/rexgpu-before.so && {
            echo "::error::Patch made no changes to $GPU_SO"
            exit 1
          }

          echo "ReXGPU patch applied."

          echo
          echo "Before:"
          sha256sum work/rexgpu-before.so

          echo "After:"
          sha256sum "$REXGPU_PATH"

      # ------------------------------------------------------------
      # REPACK
      # ------------------------------------------------------------
      - name: Repack APK
        shell: bash
        run: |
          set -euo pipefail

          cd work/apk

          # Keep APK entries stored. zipalign will perform the
          # required alignment of native libraries afterwards.
          zip -q -r -0 ../patched-unsigned.apk .

          cd ../..

          test -s work/patched-unsigned.apk

          echo "Repacked APK:"
          ls -lh work/patched-unsigned.apk

      # ------------------------------------------------------------
      # VERSION
      #
      # This is deliberately a hard failure until the existing
      # APK's manifest/versionCode handling is wired in correctly.
      #
      # Do NOT modify AndroidManifest.xml with sed/strings.
      # ------------------------------------------------------------
      - name: Update Android version
        shell: bash
        run: |
          set -euo pipefail

          echo "Target versionName: $VERSION_NAME"
          echo
          echo "The APK manifest must be updated with proper Android tooling."
          echo "The existing versionCode must also be increased."
          echo
          echo "This workflow intentionally stops here until the original"
          echo "versionCode/package metadata is wired in."
          exit 1

      # ------------------------------------------------------------
      # 16 KB ALIGNMENT
      # ------------------------------------------------------------
      - name: Zipalign for 16 KB pages
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_BUILD_TOOLS/zipalign" \
            -P 16 \
            -f \
            4 \
            work/versioned-unsigned.apk \
            work/legacyrecomp-android-1.2-aligned.apk

      - name: Verify 16 KB alignment
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_BUILD_TOOLS/zipalign" \
            -c \
            -P 16 \
            -v \
            4 \
            work/legacyrecomp-android-1.2-aligned.apk

      # ------------------------------------------------------------
      # SIGNING
      #
      # IMPORTANT:
      # Put the EXACT signing operation already used by your
      # existing LegacyRecomp workflow here.
      #
      # No new keystore is generated.
      # No new signing identity is created.
      # ------------------------------------------------------------
      - name: Sign APK using existing LegacyRecomp signing
        shell: bash
        run: |
          set -euo pipefail

          echo "::error::Existing LegacyRecomp signing command must be inserted here."
          exit 1

      # ------------------------------------------------------------
      # FINAL CHECK
      # ------------------------------------------------------------
      - name: Verify final APK
        shell: bash
        run: |
          set -euo pipefail

          FINAL="legacyrecomp-android-1.2.apk"

          test -f "$FINAL"

          "$ANDROID_BUILD_TOOLS/apksigner" verify \
            --verbose \
            "$FINAL"

          "$ANDROID_BUILD_TOOLS/zipalign" \
            -c \
            -P 16 \
            -v \
            4 \
            "$FINAL"

          echo
          echo "SUCCESS:"
          ls -lh "$FINAL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: legacyrecomp-android-1.2-mali-g57
          path: legacyrecomp-android-1.2.apk
          if-no-files-found: error
