name: Patch ReXGPU Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Verify input files
        run: |
          set -euo pipefail

          test -f legacyrecomp-android.apk
          test -f librexgpu-xenos.so

          echo "APK:"
          ls -lh legacyrecomp-android.apk

          echo "ReXGPU:"
          ls -lh librexgpu-xenos.so

      - name: Install Android build tools
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "build-tools;35.0.0"

          echo "Build tools:"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -h | head -20

      - name: Prepare APK
        run: |
          set -euo pipefail

          mkdir -p work/apk

          cp legacyrecomp-android.apk work/input.apk
          unzip -q work/input.apk -d work/apk

      - name: Replace ReXGPU library
        run: |
          set -euo pipefail

          FOUND="$(find work/apk -type f -name 'librexgpu-xenos.so' | head -n 1)"

          if [ -z "$FOUND" ]; then
            echo "::error::librexgpu-xenos.so was not found inside the APK"
            exit 1
          fi

          echo "Replacing:"
          echo "$FOUND"

          cp librexgpu-xenos.so "$FOUND"

      - name: Update APK version to 1.2
        run: |
          set -euo pipefail

          echo "Version metadata must be updated in the APK manifest/build source."
          echo "Do NOT modify package/application ID."

          # This step intentionally stops rather than silently
          # corrupting AndroidManifest.xml with a text replacement.
          #
          # We should use apktool/aapt2 here once the current APK's
          # manifest/versionCode is confirmed.

      - name: Rebuild APK
        run: |
          set -euo pipefail

          cd work/apk

          zip -q -r ../rebuilt-unsigned.apk .

          cd ../..

          test -s work/rebuilt-unsigned.apk

      - name: Zipalign
        run: |
          set -euo pipefail

          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"

          "$ZIPALIGN" -p -f 4 \
            work/rebuilt-unsigned.apk \
            work/legacyrecomp-android-1.2-aligned.apk

          "$ZIPALIGN" -c -p -v 4 \
            work/legacyrecomp-android-1.2-aligned.apk

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          mkdir -p signing

          echo "$KEYSTORE_BASE64" | base64 --decode > signing/release.keystore

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$APKSIGNER" sign \
            --ks signing/release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out legacyrecomp-android-1.2.apk \
            work/legacyrecomp-android-1.2-aligned.apk

      - name: Verify signature
        run: |
          set -euo pipefail

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            legacyrecomp-android-1.2.apk

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: legacyrecomp-android-1.2
          path: legacyrecomp-android-1.2.apk
          if-no-files-found: error
